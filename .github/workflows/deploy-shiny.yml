name: Deploy WebGIS Probolinggo

on:
  push:
    branches: [main]
    paths:
      - "app.R"
      - "data/hasil/**"
      - ".github/workflows/deploy-shiny.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-webgis-probolinggo
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
   steps:
      - name: Check out source
        uses: actions/checkout@v4
    
      # Download dan ekstrak GeoTIFF
      # Prepare GeoJSON dan CSV
      # Validate required files
    
      - name: Install Linux spatial dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgdal-dev libgeos-dev libproj-dev \
            libudunits2-dev libssl-dev libcurl4-openssl-dev \
            libxml2-dev
    
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
    
      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shiny
            any::leaflet
            any::terra
            any::raster
            any::sf
            any::DT
            any::rsconnect
            any::renv
    
      # Check shinyapps.io credentials
    
      # Verify Shiny dependencies
    
      # Deploy to shinyapps.io
      - name: Download and extract raster package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh release download data-v1 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "raster-webgis.zip" \
            --dir .

          mkdir -p data/hasil

          unzip -o raster-webgis.zip -d data/hasil

          echo "Memeriksa hasil ekstraksi:"
          ls -lh data/hasil/

          for nama in NDVI NDWI NDCI NDBI Komposit; do
            test -s "data/hasil/${nama}_4326.tif"
            echo "BERHASIL: ${nama}_4326.tif"
          done


      - name: Prepare GeoJSON and CSV files
        run: |
          set -euo pipefail

          mkdir -p data/hasil

          cp kabupaten.geojson data/hasil/kabupaten.geojson
          cp kecamatan.geojson data/hasil/kecamatan.geojson
          cp Zonal_Statistics_Probolinggo.csv data/hasil/Zonal_Statistics_Probolinggo.csv

          echo "Memeriksa semua file WebGIS:"
          ls -lh data/hasil/

      
      - name: Verify Shiny dependencies
        shell: bash
        run: |
          cat > verify_dependencies.R <<'RSCRIPT'
          packages <- c(
            "shiny",
            "leaflet",
            "terra",
            "raster",
            "sf",
            "DT",
            "rsconnect"
          )

          missing <- packages[
            !vapply(
              packages,
              requireNamespace,
              logical(1),
              quietly = TRUE
            )
          ]

          if (length(missing) > 0) {
            stop(
              "Packages missing: ",
              paste(missing, collapse = ", ")
            )
          }

          cat("Semua paket utama tersedia.\n")

          deps <- rsconnect::appDependencies(
            appDir = ".",
            appMode = "shiny",
            dependencyResolution = "library"
          )

          print(deps[, c("Package", "Version")])

          if (!"shiny" %in% deps$Package) {
            stop("Paket shiny tidak terdeteksi!")
          }

          cat("Verifikasi dependency berhasil.\n")
          RSCRIPT

          Rscript verify_dependencies.R

      - name: Install Linux spatial dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgdal-dev libgeos-dev libproj-dev libudunits2-dev \
            libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
          use-public-rspm: true

      - name: Install R dependencies
        shell: bash
        run: |
          Rscript -e 'install.packages(c("shiny", "leaflet", "terra", "raster", "sf", "DT", "rsconnect"), repos="https://cloud.r-project.org")'

      - name: Check shinyapps.io credentials
        env:
          RSCONNECT_USER: ${{ secrets.RSCONNECT_USER }}
          RSCONNECT_TOKEN: ${{ secrets.RSCONNECT_TOKEN }}
          RSCONNECT_SECRET: ${{ secrets.RSCONNECT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          for key in RSCONNECT_USER RSCONNECT_TOKEN RSCONNECT_SECRET; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing GitHub Actions secret: $key"
              exit 1
            fi
          done


      - name: Verify Shiny dependencies
        shell: bash
        run: |
          Rscript -e '
            packages <- c(
              "shiny", "leaflet", "terra",
              "raster", "sf", "DT", "rsconnect", "renv"
            )

            missing <- packages[
              !vapply(packages, requireNamespace, logical(1),
                      quietly = TRUE)
            ]

            if (length(missing)) {
              stop("Packages missing: ",
                   paste(missing, collapse = ", "))
            }

            deps <- rsconnect::appDependencies(
              appDir = ".",
              appMode = "shiny",
              dependencyResolution = "library"
            )

            print(deps[, c("Package", "Version")])

            if (!"shiny" %in% deps$Package) {
              stop("shiny tidak terdeteksi sebagai dependency!")
            }

            cat("Semua pemeriksaan dependency berhasil.\n")
          

      - name: Deploy to shinyapps.io
        env:
          RSCONNECT_USER: ${{ secrets.RSCONNECT_USER }}
          RSCONNECT_TOKEN: ${{ secrets.RSCONNECT_TOKEN }}
          RSCONNECT_SECRET: ${{ secrets.RSCONNECT_SECRET }}
        shell: bash
        run: |
          Rscript -e '
            rsconnect::setAccountInfo(
              name = Sys.getenv("RSCONNECT_USER"),
              token = Sys.getenv("RSCONNECT_TOKEN"),
              secret = Sys.getenv("RSCONNECT_SECRET")
            )
            files <- c(
              "app.R",
              file.path("data", "hasil", c(
                "NDVI_4326.tif", "NDWI_4326.tif", "NDCI_4326.tif",
                "NDBI_4326.tif", "Komposit_4326.tif",
                "kabupaten.geojson", "kecamatan.geojson",
                "Zonal_Statistics_Probolinggo.csv"
              ))
            )
            rsconnect::deployApp(
              appDir = ".",
              appMode = "shiny",
              appName = "webgis-probolinggo",
              account = Sys.getenv("RSCONNECT_USER"),
              server = "shinyapps.io",
              dependencyResolution = "library",
              forceUpdate = TRUE,
              launch.browser = FALSE
                        )
          
