name: Deploy WebGIS Probolinggo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - app.R
      - kabupaten.geojson
      - kecamatan.geojson
      - Zonal_Statistics_Probolinggo.csv
      - .github/workflows/deploy-shiny.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download and extract raster package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download data-v2 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'raster-webgis.zip' \
            --dir .
          echo 'Isi paket raster:'
          unzip -l raster-webgis.zip
          mkdir -p data/hasil
          # ZIP saat ini menyimpan kelima TIFF langsung di root arsip.
          unzip -o raster-webgis.zip -d data/hasil

      - name: Prepare GeoJSON and CSV files
        shell: bash
        run: |
          set -euo pipefail
          cp kabupaten.geojson data/hasil/kabupaten.geojson
          cp kecamatan.geojson data/hasil/kecamatan.geojson
          cp Zonal_Statistics_Probolinggo.csv data/hasil/Zonal_Statistics_Probolinggo.csv

      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            app.R \
            data/hasil/NDVI_4326.tif \
            data/hasil/NDWI_4326.tif \
            data/hasil/NDCI_4326.tif \
            data/hasil/NDBI_4326.tif \
            data/hasil/Komposit_4326.tif \
            data/hasil/kabupaten.geojson \
            data/hasil/kecamatan.geojson \
            data/hasil/Zonal_Statistics_Probolinggo.csv; do
            if [[ ! -s "$file" ]]; then
              echo "::error::File tidak ada/kosong: $file"
              exit 1
            fi
            echo "OK: $file"
          done

      - name: Install Linux spatial dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgdal-dev libgeos-dev libproj-dev libudunits2-dev \
            libssl-dev libcurl4-openssl-dev libxml2-dev \
            libfontconfig1-dev libfreetype6-dev libpng-dev \
            libtiff5-dev libjpeg-dev

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
          use-public-rspm: false
      
      - name: Configure CRAN repository
        shell: bash
        run: |
          echo 'options(repos = c(CRAN = "https://cloud.r-project.org"))' >> ~/.Rprofile

          echo "RENV_CONFIG_REPOS_OVERRIDE=CRAN=https://cloud.r-project.org" >> "$GITHUB_ENV"
          echo "RENV_CONFIG_PPM_ENABLED=false" >> "$GITHUB_ENV"
          echo "RSCONNECT_PACKRAT=true" >> "$GITHUB_ENV"

          Rscript -e 'print(getOption("repos"))'

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shiny
            any::leaflet
            any::terra
            any::raster
            any::sf
            any::DT
            any::rsconnect
          cache-version: 1

      
      - name: Verify package repository URLs
        shell: bash
        run: |
          Rscript - <<'RSCRIPT'
          options(repos = c(CRAN = "https://cloud.r-project.org"))

          deps <- rsconnect::appDependencies(
            appDir = ".",
            appMode = "shiny",
            dependencyResolution = "library"
          )

          selected <- deps[
            deps$Package %in% c("shiny", "terra"),
            ,
            drop = FALSE
          ]

          print(selected[, c("Package", "Version", "Source", "Repository")])

          stopifnot(nrow(selected) == 2)
          stopifnot(all(grepl("^https?://", selected$Repository)))

          cat("Repository shiny dan terra valid.\n")
          RSCRIPT

          
      - name: Verify Shiny dependencies
        shell: bash
        run: |
          Rscript -e 'pkgs <- c("shiny", "leaflet", "terra", "raster", "sf", "DT", "rsconnect"); missing <- pkgs[!vapply(pkgs, requireNamespace, logical(1), quietly = TRUE)]; if (length(missing)) stop("Paket hilang: ", paste(missing, collapse = ", ")); cat("Semua paket utama tersedia.\n")'

      - name: Check shinyapps.io credentials
        env:
          RSCONNECT_USER: ${{ secrets.RSCONNECT_USER }}
          RSCONNECT_TOKEN: ${{ secrets.RSCONNECT_TOKEN }}
          RSCONNECT_SECRET: ${{ secrets.RSCONNECT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          for name in RSCONNECT_USER RSCONNECT_TOKEN RSCONNECT_SECRET; do
            if [[ -z "${!name}" ]]; then
              echo "::error::GitHub Secret $name belum dibuat"
              exit 1
            fi
          done
          echo 'Kredensial tersedia (nilainya tidak ditampilkan).'

      - name: Deploy to shinyapps.io
        env:
          RSCONNECT_USER: ${{ secrets.RSCONNECT_USER }}
          RSCONNECT_TOKEN: ${{ secrets.RSCONNECT_TOKEN }}
          RSCONNECT_SECRET: ${{ secrets.RSCONNECT_SECRET }}
        shell: bash
        run: |
          Rscript - <<'RSCRIPT'
          rsconnect::setAccountInfo(
            name = Sys.getenv("RSCONNECT_USER"),
            token = Sys.getenv("RSCONNECT_TOKEN"),
            secret = Sys.getenv("RSCONNECT_SECRET")
          )
          berkas <- c(
            "app.R",
            paste0("data/hasil/", c("NDVI", "NDWI", "NDCI", "NDBI", "Komposit"), "_4326.tif"),
            "data/hasil/kabupaten.geojson",
            "data/hasil/kecamatan.geojson",
            "data/hasil/Zonal_Statistics_Probolinggo.csv"
          )
          stopifnot(all(file.exists(berkas)))
          options(
            repos = c(CRAN = "https://cloud.r-project.org"),
            rsconnect.packrat = TRUE
          )
          
          Sys.setenv(
            RENV_CONFIG_REPOS_OVERRIDE = "CRAN=https://cloud.r-project.org",
            RENV_CONFIG_PPM_ENABLED = "false"
          )
          rsconnect::deployApp(
            appDir = ".",
            appFiles = berkas,
            appName = "webgis-probolinggo",
            account = Sys.getenv("RSCONNECT_USER"),
            server = "shinyapps.io",
            appMode = "shiny",
            dependencyResolution = "library",
            forceUpdate = TRUE,
            launch.browser = FALSE
          )
          RSCRIPT
